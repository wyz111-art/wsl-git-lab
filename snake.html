<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: "Microsoft YaHei", Arial, sans-serif;
  }

  .container {
    text-align: center;
    padding: 20px;
  }

  h1 {
    color: #e94560;
    margin-bottom: 15px;
    letter-spacing: 2px;
  }

  .score-board {
    color: #fff;
    font-size: 18px;
    margin-bottom: 10px;
  }

  .score-board span {
    color: #4ecca3;
    font-weight: bold;
    font-size: 22px;
  }

  canvas {
    border: 3px solid #4ecca3;
    border-radius: 5px;
    background: #16213e;
    box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
  }

  .tips {
    color: #888;
    margin-top: 15px;
    font-size: 14px;
  }

  .game-over-tip {
    color: #e94560;
    font-weight: bold;
    margin-top: 10px;
    font-size: 18px;
    min-height: 28px;
  }

  button {
    margin-top: 10px;
    padding: 10px 30px;
    font-size: 16px;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    letter-spacing: 1px;
  }

  button:hover {
    background: #ff5c7a;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🐍 贪吃蛇</h1>
  <div class="score-board">得分：<span id="score">0</span></div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div class="game-over-tip" id="tip"></div>
  <button id="restartBtn">重新开始</button>
  <div class="tips">方向键 / WASD 控制移动，空格键暂停</div>
</div>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const tipEl = document.getElementById('tip');
  const restartBtn = document.getElementById('restartBtn');

  // 游戏参数
  const GRID_SIZE = 20;        // 每格像素
  const COLS = canvas.width / GRID_SIZE;   // 20
  const ROWS = canvas.height / GRID_SIZE;  // 20
  const BASE_SPEED = 150;      // 初始移动间隔(毫秒)

  let snake, food, direction, nextDirection, score, gameOver, paused, timer, speed;

  function init() {
    // 蛇：从中间开始，长度为3，向右移动
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    gameOver = false;
    paused = false;
    speed = BASE_SPEED;
    scoreEl.textContent = '0';
    tipEl.textContent = '';
    placeFood();
    draw();
    startLoop();
  }

  // 随机放置食物（避开蛇身）
  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y));
    food = pos;
  }

  function startLoop() {
    clearInterval(timer);
    timer = setInterval(step, speed);
  }

  // 每次移动的逻辑
  function step() {
    if (gameOver || paused) return;

    direction = nextDirection;

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    // 撞墙检测
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      endGame();
      return;
    }

    // 撞自己检测（新头不能与即将移动后的身体重合；蛇尾会移走，故忽略最后一段）
    const bodyToCheck = snake.slice(0, -1);
    if (bodyToCheck.some(seg => seg.x === head.x && seg.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    // 吃到食物
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      // 加速：得分越高越快
      speed = Math.max(60, BASE_SPEED - Math.floor(score / 50) * 15);
      startLoop();
    } else {
      snake.pop(); // 没吃到就移除尾部
    }

    draw();
  }

  function endGame() {
    gameOver = true;
    clearInterval(timer);
    tipEl.textContent = '游戏结束！得分：' + score;
    draw();
  }

  function togglePause() {
    if (gameOver) return;
    paused = !paused;
    tipEl.textContent = paused ? '已暂停，按空格继续' : '';
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制食物
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.arc(
      food.x * GRID_SIZE + GRID_SIZE / 2,
      food.y * GRID_SIZE + GRID_SIZE / 2,
      GRID_SIZE / 2 - 2,
      0,
      Math.PI * 2
    );
    ctx.fill();

    // 绘制蛇
    snake.forEach((seg, i) => {
      // 蛇头更亮
      ctx.fillStyle = i === 0 ? '#4ecca3' : '#36a184';
      ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);

      // 蛇头画眼睛
      if (i === 0) {
        ctx.fillStyle = '#16213e';
        const cx = seg.x * GRID_SIZE + GRID_SIZE / 2;
        const cy = seg.y * GRID_SIZE + GRID_SIZE / 2;
        const offset = 3;
        if (direction.x === 1) {
          ctx.fillRect(cx + 3, cy - 4, 3, 3);
          ctx.fillRect(cx + 3, cy + 2, 3, 3);
        } else if (direction.x === -1) {
          ctx.fillRect(cx - 6, cy - 4, 3, 3);
          ctx.fillRect(cx - 6, cy + 2, 3, 3);
        } else if (direction.y === -1) {
          ctx.fillRect(cx - 4, cy - 6, 3, 3);
          ctx.fillRect(cx + 2, cy - 6, 3, 3);
        } else {
          ctx.fillRect(cx - 4, cy + 3, 3, 3);
          ctx.fillRect(cx + 2, cy + 3, 3, 3);
        }
      }
    });
  }

  // 键盘控制
  document.addEventListener('keydown', function (e) {
    const key = e.key.toLowerCase();

    if (key === ' ') {
      e.preventDefault();
      togglePause();
      return;
    }

    let newDir = null;
    if (key === 'arrowup' || key === 'w') newDir = { x: 0, y: -1 };
    else if (key === 'arrowdown' || key === 's') newDir = { x: 0, y: 1 };
    else if (key === 'arrowleft' || key === 'a') newDir = { x: -1, y: 0 };
    else if (key === 'arrowright' || key === 'd') newDir = { x: 1, y: 0 };
    else return;

    e.preventDefault();

    // 禁止直接反向（不能掉头）
    if (newDir.x === -direction.x && newDir.y === -direction.y) return;
    nextDirection = newDir;
  });

  restartBtn.addEventListener('click', init);

  // 启动游戏
  init();
})();
</script>
</body>
</html>
